
services:
  
  web:
    build: .
    ports:
      - "8082:80"
    volumes:
      - ./:/var/www/html:Z
      - ./php/custom.ini:/usr/local/etc/php/conf.d/custom.ini:ro
      - vendor_data:/var/www/html/vendor
    depends_on:
      - db

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tablon_anuncios
      MYSQL_USER: dev
      MYSQL_PASSWORD: dev
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql:ro

  phpmyadmin:
    image: phpmyadmin
    ports:
      - "8083:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

volumes:
  db_data:
  vendor_data:
